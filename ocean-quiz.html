</style></head><body class="explore-page"><header class="exp-nav"><a href="index.html">≋ ABYSS</a><a href="index.html#mysteries">← Back to Ocean Mysteries</a></header><section class="exp-hero"><p class="eyebrow">Dive deeper · Discover more</p><h1>Quick Ocean Quiz</h1><p class="lead">Test your ocean knowledge. Choose an answer for each question and see your score at the end.</p></section><main class="content"><div class="card" id="quizbox"><p class="eyebrow" id="progress">Question 1 of 5</p><h2 id="question">Which zone receives the most sunlight?</h2><div id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="action" id="next" hidden>Next question →</button><button class="action" id="restart" hidden>Try again ↻</button></div><script>
const qs=[{q:'Which ocean zone receives the most sunlight?',a:['Sunlight Zone','Abyssal Zone','Hadal Zone'],c:0,e:'The Sunlight Zone is the upper layer, where enough sunlight penetrates for photosynthesis.'},{q:'What is bioluminescence?',a:['Light produced by living organisms','Light reflected only from the Moon','A type of ocean current'],c:0,e:'Bioluminescence is light created by a living organism through a chemical reaction.'},{q:'Which tool uses sound echoes to map the seafloor?',a:['Sonar','Thermometer','Compass alone'],c:0,e:'Sonar uses sound pulses and returning echoes to measure underwater features.'},{q:'What are hydrothermal vents?',a:['Seafloor openings releasing heated, mineral-rich fluids','Floating icebergs','Shallow coral lagoons'],c:0,e:'Hydrothermal vents release hot fluids from the seafloor and can support unique ecosystems.'},{q:'Which statement about deep-sea life is true?',a:['Some animals survive in extreme pressure','No animals live below sunlight','All deep-sea animals make their own light'],c:0,e:'Deep-sea animals have varied adaptations; not all produce light, but many tolerate high pressure.'}];let i=0,score=0,locked=false;const q=document.getElementById('question'),a=document.getElementById('answers'),f=document.getElementById('feedback'),p=document.getElementById('progress'),n=document.getElementById('next'),r=document.getElementById('restart');function render(){locked=false;p.textContent='Question '+(i+1)+' of '+qs.length;q.textContent=qs[i].q;a.innerHTML='';f.textContent='';n.hidden=true;r.hidden=true;qs[i].a.forEach((v,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>{if(locked)return;locked=true;if(j===qs[i].c){score++;f.textContent='Correct! '+qs[i].e}else f.textContent='Not quite. '+qs[i].e;[...a.children].forEach(x=>x.disabled=true);if(i===qs.length-1){n.hidden=true;r.hidden=false;r.textContent='Your score: '+score+'/'+qs.length+' · Try again ↻'}else n.hidden=false};a.appendChild(b)})}n.onclick=()=>{i++;render()};r.onclick=()=>{i=0;score=0;render()};render();</script></main><footer>ABYSS · Explore responsibly. The ocean still has stories to tell.</footer></body></html>
